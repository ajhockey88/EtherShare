plugins {
    id "com.android.application"
}

android {
    namespace "com.ethershare"
    compileSdk 34

    defaultConfig {
        applicationId "com.ethershare"
        minSdk 31
        targetSdk 33
        versionCode 6
        versionName "1.1.3"
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

dependencies {
    implementation "dev.rikka.shizuku:aidl:13.1.5"
}
